<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840.0 390.0" width="840" height="390" role="img" aria-label="Who am I. I build data products end to end: from raw files and sensors to validated pipelines, models, web apps, and the report someone actually reads. At Hyundai Motor Brasil (R&amp;D, Energy Efficiency &amp; Data Analytics) I designed and shipped an internal analysis app (Python, Streamlit, SQLite) that cut analysis time by ~80% and became a paper at SIMEA 2026. Electrical Engineer from Poli-USP. Six years on the BAJA SAE team, where I helped build the car's telemetry data logger. Currently leveling up SQL and Power BI; next up: Databricks. Portuguese (native) · English (C1) · Spanish (B1)"><title>Who am I. I build data products end to end: from raw files and sensors to validated pipelines, models, web apps, and the report someone actually reads. At Hyundai Motor Brasil (R&amp;D, Energy Efficiency &amp; Data Analytics) I designed and shipped an internal analysis app (Python, Streamlit, SQLite) that cut analysis time by ~80% and became a paper at SIMEA 2026. Electrical Engineer from Poli-USP. Six years on the BAJA SAE team, where I helped build the car's telemetry data logger. Currently leveling up SQL and Power BI; next up: Databricks. Portuguese (native) · English (C1) · Spanish (B1)</title><style>@font-face{font-family:'Pixelify';src:url(data:font/woff;base64,) format('woff');font-weight:400 700}text{font-variant-ligatures:none;font-feature-settings:"liga" 0,"clig" 0}text{font-family:'Pixelify',ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace;white-space:pre}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="1" y="1" width="838" height="388" rx="10" fill="#0f1a2e" stroke="#2b4470" stroke-width="2"/><path d="M2 11a9 9 0 0 1 9-9h818a9 9 0 0 1 9 9v41H2z" fill="#13233f"/><rect x="2" y="52" width="836" height="2" fill="#2b4470"/><text x="24" y="35" fill="#ffcb05" font-size="22" font-weight="700